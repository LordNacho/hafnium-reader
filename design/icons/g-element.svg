<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f6"/>
      <stop offset=".5" stop-color="#c4c9d0"/>
      <stop offset="1" stop-color="#8d949f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#metal)"/>
  <rect x="-300" y="420" width="1624" height="110" fill="url(#sheen)" transform="rotate(-35 512 512)"/>
  <g transform="translate(512 512) scale(.8) translate(-540 -470)">
    <g fill="none" stroke="#1d2027" stroke-linecap="round" stroke-linejoin="round">
      <!-- atomic number 72 -->
      <path d="M250 250 H318 L276 350" stroke-width="22"/>
      <path d="M356 274 A31 31 0 1 1 410 298 L354 350 H420" stroke-width="22"/>
      <!-- H -->
      <path d="M260 440 V740 M440 440 V740 M260 590 H440" stroke-width="66"/>
      <!-- f -->
      <path d="M600 740 V530 Q600 440 690 440" stroke-width="66"/>
      <path d="M535 580 H680" stroke-width="58"/>
    </g>
    <!-- feed mark where the atomic mass would sit -->
    <g fill="none" stroke="#d9480f" stroke-width="30" stroke-linecap="round">
      <path d="M720 260 A70 70 0 0 1 790 330"/>
      <path d="M720 200 A130 130 0 0 1 850 330" opacity=".5"/>
    </g>
    <circle cx="720" cy="330" r="24" fill="#d9480f"/>
  </g>
</svg>
